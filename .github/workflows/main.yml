name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install & Build Web Assets
        run: |
          npm install
          npm run build || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Capacitor & Build Android APK
        run: |
          npx @capacitor/cli init "سجلي المدرسي" "com.alhunaidi.schoolrecord" --web-dir "dist" || true
          npm install @capacitor/core @capacitor/android
          npx cap add android || true
          npx cap copy android || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SchoolRecordApp-APK
          path: android/app/build/outputs/apk/debug/*.apk
